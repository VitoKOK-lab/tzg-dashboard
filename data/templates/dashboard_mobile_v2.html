<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TZG 電商部 · 日報</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500;700&display=swap');

:root{
  /* ===== 品牌 token(取自 brand/colors_and_type.css 五色制) ===== */
  --zana-pink:#E6007E; --gold:#C5B382; --tahir-blue:#50C8BE; --dark-pink:#B12468;
  --gold-050:#FAF6EA; --gold-100:#EFE7CF; --gold-300:#DCCD9E; --gold-deep:#937C44;
  --pink-050:#FDF0F7; --pink-100:#FBD9EC; --pink-200:#F4A9D2;
  --teal-050:#EAF8F6; --teal-100:#CFEEEA;
  --ink:#2B1822; --ink-soft:#6A5560; --ink-faint:#A999A2;
  --line:#EDE4E8; --line-gold:#E7DEC8;
  --paper:#FFFFFF; --paper-warm:#FFFCFA;
  --warn-bg:#FFF4E5; --warn-ink:#8A5A12; --warn-dot:#E6A23C;
  /* 功能色(財經慣例:紅漲綠跌,跟品牌桃紅呼應) */
  --up:#E6007E; --up-bg:#FDF0F7; --dn:#0F8F7A; --dn-bg:#EAF8F6;
  --font-tc:'Noto Sans TC','Microsoft JhengHei','思源黑體','PingFang TC',sans-serif;
  --font-mono:'DM Mono','Menlo','Monaco','Courier New',monospace;
  --shadow-sm:0 1px 3px rgba(43,24,34,.06);
  --shadow-md:0 8px 24px rgba(43,24,34,.09);
  --shadow-gold:0 10px 28px rgba(197,179,130,.28);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--paper-warm);color:var(--ink);font-family:var(--font-tc);-webkit-font-smoothing:antialiased;}
body{padding-bottom:40px;min-height:100vh;}
.tabular{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

/* ===== Topbar(含品牌 logo) ===== */
#topbar{position:sticky;top:0;z-index:50;background:var(--ink);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-sm);gap:10px;}
.tb-left{display:flex;align-items:center;gap:9px;min-width:0;}
.tb-logo{height:24px;width:auto;flex-shrink:0;opacity:.95;}
.tb-brand{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
.tb-brand-n{font-size:13.5px;font-weight:700;color:#fff;white-space:nowrap;}
.tb-brand-s{font-size:9px;letter-spacing:1.5px;color:var(--gold-100);text-transform:uppercase;}
#tb-update{font-size:10.5px;font-family:var(--font-mono);color:rgba(255,255,255,.65);display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;transition:background .2s,color .2s;flex-shrink:0;white-space:nowrap;}
#tb-update.stale{background:var(--warn-bg);color:var(--warn-ink);font-weight:700;}
#tb-update .dot{width:6px;height:6px;border-radius:50%;background:#4CD964;flex-shrink:0;}
#tb-update.stale .dot{background:var(--warn-dot);}

/* ===== Tab 導覽(精簡:只留主要,次要收進更多) ===== */
#tabbar{position:sticky;top:41px;z-index:49;background:var(--paper);display:flex;padding:0 14px;border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm);overflow-x:auto;}
.tb-item{padding:11px 13px;font-size:12.5px;font-weight:600;color:var(--ink-faint);white-space:nowrap;border-bottom:2.5px solid transparent;transition:color .15s;}
.tb-item.on{color:var(--gold-deep);border-bottom-color:var(--gold);}

main{padding:14px 14px 0;max-width:560px;margin:0 auto;}

/* ===== KPI 卡片(升級:進度條 + 昨日/本週對比) ===== */
#kpi-card{background:linear-gradient(145deg,var(--ink) 0%,#3E2733 100%);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-md);}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.kpi-label{font-size:12px;color:rgba(255,255,255,.62);display:flex;align-items:center;gap:5px;}
.kpi-target{font-size:11px;color:rgba(255,255,255,.45);}
.kpi-main{font-family:var(--font-mono);font-size:27px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1.15;}
.kpi-progress-track{height:7px;border-radius:4px;background:rgba(255,255,255,.14);margin:10px 0 6px;overflow:hidden;}
.kpi-progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold-300),var(--gold));transition:width .5s ease;}
.kpi-progress-label{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.55);}
.kpi-progress-pct{font-family:var(--font-mono);font-weight:700;color:var(--gold-100);}

.kpi-proj{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);}
.kpi-proj-label{font-size:11.5px;color:rgba(255,255,255,.6);}
.kpi-proj-val{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--tahir-blue);}

.kpi-compare{display:flex;gap:8px;margin-top:12px;}
.kpi-cbox{flex:1;background:rgba(255,255,255,.06);border-radius:11px;padding:9px 11px;}
.kpi-cbox-l{font-size:10px;color:rgba(255,255,255,.5);margin-bottom:3px;}
.kpi-cbox-v{font-family:var(--font-mono);font-size:14px;font-weight:600;color:#fff;}
.trend-chip{display:inline-flex;align-items:center;gap:1px;font-family:var(--font-mono);font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;margin-top:3px;}
.trend-up{background:rgba(230,0,126,.22);color:#FF6FB4;}
.trend-down{background:rgba(15,143,122,.22);color:#5CE0C6;}

/* ===== 排行榜卡片 ===== */
.rank-card{background:var(--paper);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
.rank-head{display:flex;align-items:center;gap:9px;margin-bottom:13px;}
.rank-icon{width:30px;height:30px;border-radius:10px;background:var(--gold-050);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rank-icon svg{width:16px;height:16px;stroke:var(--gold-deep);}
.rank-title{font-size:15px;font-weight:700;color:var(--ink);}
.rank-sub{font-size:11px;color:var(--ink-faint);margin-top:1px;}

.rank-item{display:flex;align-items:center;gap:11px;padding:10px 0;}
.rank-item + .rank-item{border-top:1px solid var(--line);}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;}
.rank-badge{position:absolute;margin-left:22px;margin-top:20px;width:15px;height:15px;border-radius:50%;background:var(--gold);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);}
.avatar-wrap{position:relative;flex-shrink:0;}
.rank-body{flex:1;min-width:0;}
.rank-name{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-bar-track{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden;}
.rank-bar-fill{height:100%;border-radius:3px;}
.rank-value{font-family:var(--font-mono);font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;flex-shrink:0;text-align:right;}
.rank-value small{display:block;font-size:10px;font-weight:400;color:var(--ink-faint);margin-top:2px;}

.empty-hint{font-size:12px;color:var(--ink-faint);text-align:center;padding:14px 0;}

/* ===== 更多(原生 details,免 JS,內建無障礙) ===== */
details#more{background:var(--paper);border-radius:18px;border:1px solid var(--line);margin-bottom:16px;overflow:hidden;}
details#more summary{list-style:none;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink-soft);}
details#more summary::-webkit-details-marker{display:none;}
details#more summary::after{content:'';width:9px;height:9px;border-right:1.6px solid var(--ink-faint);border-bottom:1.6px solid var(--ink-faint);transform:rotate(45deg);transition:transform .2s;}
details#more[open] summary::after{transform:rotate(-135deg);}
#more-body{padding:4px 16px 16px;}
.more-section{padding:14px 0;}
.more-section + .more-section{border-top:1px solid var(--line);}
.more-section-title{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:10px;}
.more-link{display:block;padding:10px 0;font-size:13px;color:var(--ink-soft);}
.more-link a{color:var(--zana-pink);font-weight:600;text-decoration:none;}

/* 年度對比:雙色並排長條圖 + YoY */
.yoy-row{padding:9px 0;}
.yoy-row + .yoy-row{border-top:1px solid var(--line);}
.yoy-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px;}
.yoy-month{font-weight:700;color:var(--ink);}
.yoy-bars{display:flex;flex-direction:column;gap:4px;}
.yoy-bar-row{display:flex;align-items:center;gap:8px;}
.yoy-bar-label{width:26px;font-size:10px;color:var(--ink-faint);flex-shrink:0;}
.yoy-bar-track{flex:1;height:14px;border-radius:4px;background:var(--line);overflow:hidden;}
.yoy-bar-fill{height:100%;border-radius:4px;}
.yoy-bar-fill.cur{background:linear-gradient(90deg,var(--gold-300),var(--gold));}
.yoy-bar-fill.prev{background:var(--ink-faint);opacity:.45;}
.yoy-bar-val{width:70px;text-align:right;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-soft);flex-shrink:0;}

footer{text-align:center;padding:18px 0 4px;font-size:10.5px;color:var(--ink-faint);}
@media (min-width:600px){ main{padding-top:18px;} }
</style>
</head>
<body>

<header id="topbar">
  <div class="tb-left">
    <img class="tb-logo" src="/brand/assets/logo-white.png" alt="TZG">
    <div class="tb-brand"><span class="tb-brand-n">TZG 電商部</span><span class="tb-brand-s">Daily Brief</span></div>
  </div>
  <div id="tb-update" class="__STALE_CLASS__"><span class="dot"></span><span id="tb-update-text">__LAST_UPDATE__</span></div>
</header>

<nav id="tabbar">
  <div class="tb-item on">日報</div>
  <div class="tb-item">月報</div>
  <div class="tb-item">短影音</div>
</nav>

<main>

  <section id="kpi-card">
    <div class="kpi-top">
      <div class="kpi-label">📊 本月達成</div>
      <div class="kpi-target tabular" id="kpi-target">目標 —</div>
    </div>
    <div class="kpi-main tabular" id="kpi-mtd">NT$ —</div>
    <div class="kpi-progress-track"><div class="kpi-progress-fill" id="kpi-progress-fill" style="width:0%"></div></div>
    <div class="kpi-progress-label"><span>達成進度</span><span class="kpi-progress-pct" id="kpi-mtd-pct">—</span></div>

    <div class="kpi-proj">
      <div class="kpi-proj-label">🎯 月底推算業績</div>
      <div class="kpi-proj-val tabular" id="kpi-proj">NT$ —</div>
    </div>

    <div class="kpi-compare">
      <div class="kpi-cbox">
        <div class="kpi-cbox-l">昨日業績</div>
        <div class="kpi-cbox-v tabular" id="kpi-yesterday">—</div>
        <div id="kpi-yesterday-trend"></div>
      </div>
      <div class="kpi-cbox">
        <div class="kpi-cbox-l">本週業績</div>
        <div class="kpi-cbox-v tabular" id="kpi-week">—</div>
        <div id="kpi-week-trend"></div>
      </div>
    </div>
  </section>

  <section class="rank-card" id="rank-agents">
    <div class="rank-head">
      <div class="rank-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div><div class="rank-title">客服接單排行</div><div class="rank-sub">本月 · 該表揚誰、該盯誰</div></div>
    </div>
    <div id="agents-list"></div>
  </section>

  <section class="rank-card" id="rank-products">
    <div class="rank-head">
      <div class="rank-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.91 8.84 8.56 1.69a1.93 1.93 0 0 0-1.95 0L2.08 4.4a2.1 2.1 0 0 0-.08 3.63l12.14 7a1.93 1.93 0 0 0 1.95 0l6.6-3.76a2.1 2.1 0 0 0 .22-3.43Z"/></svg></div>
      <div><div class="rank-title">商品銷售排行</div><div class="rank-sub">本月營收 Top · 什麼該加碼</div></div>
    </div>
    <div id="products-list"></div>
  </section>

  <section class="rank-card" id="rank-regions">
    <div class="rank-head">
      <div class="rank-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
      <div><div class="rank-title">地區業績排行</div><div class="rank-sub">本月 · 哪裡該注意</div></div>
    </div>
    <div id="regions-list"></div>
  </section>

  <details id="more">
    <summary>更多(年度對比、滯銷商品、完整版)</summary>
    <div id="more-body">
      <div class="more-section">
        <div class="more-section-title">年度業績對比</div>
        <div id="yoy-table"></div>
      </div>
      <div class="more-section">
        <div class="more-section-title">滯銷商品(≥60 天沒賣)</div>
        <div id="dormant-list"></div>
      </div>
      <div class="more-section">
        <div class="more-link">即時 / 代理 / 品牌 / 購物習慣 / 客戶結構 / 未付款提醒</div>
        <div class="more-link"><a href="dashboard_latest.html">查看完整舊版 →</a></div>
      </div>
    </div>
  </details>

  <footer>TZG 電商部 日報(手機版 · 測試中,正式版請看完整版)</footer>

</main>

<script>
const D={};
</script>
<script>
const AVATAR_COLORS = ['#C5B382','#50C8BE','#E6007E','#B12468'];

function fmtMoney(n){ return 'NT$' + Math.round(n).toLocaleString('zh-TW'); }
function fmtMoneyShort(n){
  const v = Math.round(n);
  if (Math.abs(v) >= 10000) return 'NT$' + (v/10000).toFixed(1).replace(/\.0$/,'') + '萬';
  return fmtMoney(v);
}
function fmtPct(n){ return n + '%'; }
function trendChip(pct){
  if (pct === null || pct === undefined || isNaN(pct)) return '';
  const up = pct >= 0;
  return `<span class="trend-chip ${up ? 'trend-up' : 'trend-down'}">${up ? '▲' : '▼'} ${Math.abs(pct)}%</span>`;
}

function renderKpi(){
  const k = D.kpi || {};
  document.getElementById('kpi-target').textContent = '目標 ' + fmtMoneyShort(D.target || 0);
  document.getElementById('kpi-mtd').textContent = fmtMoney(k.rev_mtd || 0);
  const pct = k.achievement_pct ?? 0;
  document.getElementById('kpi-mtd-pct').textContent = fmtPct(pct);
  document.getElementById('kpi-progress-fill').style.width = Math.min(100, pct) + '%';
  document.getElementById('kpi-proj').textContent = fmtMoney(k.rev_projected || 0);

  const y = D.yesterday || {};
  document.getElementById('kpi-yesterday').textContent = fmtMoneyShort(y.rev || 0);
  if (y.rev_ly_same !== undefined && y.rev_ly_same > 0){
    const p = Math.round((y.rev - y.rev_ly_same) / y.rev_ly_same * 1000) / 10;
    document.getElementById('kpi-yesterday-trend').innerHTML = trendChip(p);
  }

  const w = D.week || {};
  document.getElementById('kpi-week').textContent = fmtMoneyShort(w.this_rev || 0);
  if (w.last_rev !== undefined && w.last_rev > 0){
    const p = Math.round((w.this_rev - w.last_rev) / w.last_rev * 1000) / 10;
    document.getElementById('kpi-week-trend').innerHTML = trendChip(p);
  }
}

function renderRankList(containerId, items, opts){
  const el = document.getElementById(containerId);
  if (!items || !items.length){
    el.innerHTML = '<div class="empty-hint">本月尚無資料</div>';
    return;
  }
  const max = Math.max(...items.map(opts.barValue));
  el.innerHTML = items.slice(0, opts.limit || 5).map((it, i) => {
    const barPct = max > 0 ? Math.max(6, Math.round(opts.barValue(it) / max * 100)) : 0;
    const color = AVATAR_COLORS[i % AVATAR_COLORS.length];
    const avatarHtml = opts.avatar
      ? `<div class="avatar-wrap"><div class="avatar" style="background:${color}">${opts.avatar(it)}</div>${i < 3 ? `<div class="rank-badge">${i+1}</div>` : ''}</div>`
      : `<div class="avatar-wrap"><div class="avatar" style="background:${color}">${i+1}</div></div>`;
    return `<div class="rank-item">
      ${avatarHtml}
      <div class="rank-body">
        <div class="rank-name">${opts.name(it)}</div>
        <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${barPct}%;background:${color}"></div></div>
      </div>
      <div class="rank-value tabular">${opts.value(it)}${opts.sub ? `<small>${opts.sub(it)}</small>` : ''}</div>
    </div>`;
  }).join('');
}

function renderAgents(){
  renderRankList('agents-list', D.agents, {
    limit: 8,
    avatar: a => a.name.slice(0,1),
    name: a => a.name,
    barValue: a => a.rev,
    value: a => fmtMoneyShort(a.rev),
    sub: a => `${a.orders} 單`,
  });
}

function renderProducts(){
  renderRankList('products-list', D.prod_rev, {
    limit: 6,
    avatar: null,
    name: p => p.name,
    barValue: p => p.rev,
    value: p => fmtMoneyShort(p.rev),
    sub: p => `${p.qty} 件`,
  });
}

function renderRegions(){
  renderRankList('regions-list', D.regions, {
    limit: 6,
    avatar: null,
    name: r => r.name,
    barValue: r => r.rev,
    value: r => fmtMoneyShort(r.rev),
    sub: r => `${r.orders} 單`,
  });
}

function renderYoy(){
  const cur = D.monthly_26 || [], prev = D.monthly_25 || [];
  const el = document.getElementById('yoy-table');
  if (!cur.length){ el.innerHTML = '<div class="empty-hint">本月尚無資料</div>'; return; }
  const withData = cur.filter(m => m.rev > 0);
  if (!withData.length){ el.innerHTML = '<div class="empty-hint">本月尚無資料</div>'; return; }
  const recent = withData.slice(-4); // 最近 4 個有資料的月份
  const allVals = recent.flatMap((m,i) => {
    const idx = cur.indexOf(m);
    return [m.rev, (prev[idx]||{}).rev||0];
  });
  const max = Math.max(...allVals, 1);
  el.innerHTML = recent.map(m => {
    const idx = cur.indexOf(m);
    const py = prev[idx] ? prev[idx].rev : 0;
    const yoy = py > 0 ? Math.round((m.rev - py)/py*1000)/10 : null;
    return `<div class="yoy-row">
      <div class="yoy-top"><span class="yoy-month">${m.month}</span>${yoy !== null ? trendChip(yoy) : ''}</div>
      <div class="yoy-bars">
        <div class="yoy-bar-row"><span class="yoy-bar-label">今年</span><div class="yoy-bar-track"><div class="yoy-bar-fill cur" style="width:${Math.max(4,Math.round(m.rev/max*100))}%"></div></div><span class="yoy-bar-val tabular">${fmtMoneyShort(m.rev)}</span></div>
        <div class="yoy-bar-row"><span class="yoy-bar-label">去年</span><div class="yoy-bar-track"><div class="yoy-bar-fill prev" style="width:${Math.max(4,Math.round(py/max*100))}%"></div></div><span class="yoy-bar-val tabular">${fmtMoneyShort(py)}</span></div>
      </div>
    </div>`;
  }).join('');
}

function renderDormant(){
  const el = document.getElementById('dormant-list');
  const items = D.dormant_45 || [];
  if (!items.length){ el.innerHTML = '<div class="empty-hint">沒有超過 60 天沒賣的商品</div>'; return; }
  el.innerHTML = items.slice(0, 8).map(d =>
    `<div class="rank-item"><div class="rank-body"><div class="rank-name">${d.name}</div></div><div class="rank-value tabular">${d.days} 天</div></div>`
  ).join('');
}

renderKpi();
renderAgents();
renderProducts();
renderRegions();
renderYoy();
renderDormant();
</script>
</body>
</html>
