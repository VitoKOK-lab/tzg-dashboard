<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TZG 電商部 · 日報</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

:root{
  /* ===== 品牌 token(取自 brand/colors_and_type.css 五色制) ===== */
  --zana-pink:#E6007E; --gold:#C5B382; --tahir-blue:#50C8BE; --dark-pink:#B12468;
  --gold-050:#FAF6EA; --gold-100:#EFE7CF; --gold-deep:#937C44;
  --pink-050:#FDF0F7; --pink-100:#FBD9EC;
  --ink:#2B1822; --ink-soft:#6A5560; --ink-faint:#A999A2;
  --line:#EDE4E8; --line-gold:#E7DEC8;
  --paper:#FFFFFF; --paper-warm:#FFFCFA;
  --warn-bg:#FFF4E5; --warn-ink:#8A5A12; --warn-dot:#E6A23C;
  --font-tc:'Noto Sans TC','Microsoft JhengHei','思源黑體','PingFang TC',sans-serif;
  --font-mono:'DM Mono','Menlo','Monaco','Courier New',monospace;
  --shadow-sm:0 1px 3px rgba(43,24,34,.06);
  --shadow-md:0 8px 24px rgba(43,24,34,.09);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--paper-warm);color:var(--ink);font-family:var(--font-tc);-webkit-font-smoothing:antialiased;}
body{padding-bottom:40px;min-height:100vh;}
.tabular{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

/* ===== Topbar ===== */
#topbar{position:sticky;top:0;z-index:50;background:var(--ink);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-sm);}
.tb-brand{font-size:15px;font-weight:700;color:#fff;letter-spacing:.5px;}
.tb-brand em{color:var(--gold-100);font-style:normal;font-weight:400;font-size:11px;margin-left:6px;}
#tb-update{font-size:11px;font-family:var(--font-mono);color:rgba(255,255,255,.65);display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;transition:background .2s,color .2s;}
#tb-update.stale{background:var(--warn-bg);color:var(--warn-ink);font-weight:700;}
#tb-update .dot{width:6px;height:6px;border-radius:50%;background:#4CD964;flex-shrink:0;}
#tb-update.stale .dot{background:var(--warn-dot);}

main{padding:14px 14px 0;max-width:560px;margin:0 auto;}

/* ===== KPI 帶條(降級:一條,不佔整頁) ===== */
#kpi-strip{background:linear-gradient(135deg,var(--ink) 0%,#3A2430 100%);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow-md);}
.kpi-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.kpi-row + .kpi-row{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);}
.kpi-label{font-size:12px;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:6px;}
.kpi-value{font-family:var(--font-mono);font-size:22px;font-weight:500;color:#fff;font-variant-numeric:tabular-nums;}
.kpi-sub{font-size:11px;color:var(--gold-100);margin-left:8px;}
.kpi-pct{font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(197,179,130,.22);color:var(--gold-100);}

/* ===== 排行榜卡片 ===== */
.rank-card{background:var(--paper);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
.rank-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.rank-icon{width:28px;height:28px;border-radius:9px;background:var(--gold-050);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rank-icon svg{width:16px;height:16px;stroke:var(--gold-deep);}
.rank-title{font-size:15px;font-weight:700;color:var(--ink);}
.rank-sub{font-size:11px;color:var(--ink-faint);margin-top:1px;}

.rank-item{display:flex;align-items:center;gap:10px;padding:9px 0;}
.rank-item + .rank-item{border-top:1px solid var(--line);}
.rank-no{width:22px;height:22px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--font-mono);background:var(--gold-050);color:var(--gold-deep);}
.rank-item:nth-child(1) .rank-no{background:var(--gold);color:#fff;}
.rank-item:nth-child(2) .rank-no{background:var(--gold-300,#DCCD9E);color:#fff;}
.rank-item:nth-child(3) .rank-no{background:var(--gold-100);color:var(--gold-deep);}
.rank-body{flex:1;min-width:0;}
.rank-name{font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-bar-track{height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden;}
.rank-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold-100),var(--gold));}
.rank-value{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;flex-shrink:0;text-align:right;}
.rank-value small{display:block;font-size:10px;font-weight:400;color:var(--ink-faint);margin-top:1px;}

.empty-hint{font-size:12px;color:var(--ink-faint);text-align:center;padding:14px 0;}

/* ===== 更多(原生 details,免 JS,內建無障礙) ===== */
details#more{background:var(--paper);border-radius:16px;border:1px solid var(--line);margin-bottom:16px;overflow:hidden;}
details#more summary{list-style:none;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink-soft);}
details#more summary::-webkit-details-marker{display:none;}
details#more summary::after{content:'';width:9px;height:9px;border-right:1.6px solid var(--ink-faint);border-bottom:1.6px solid var(--ink-faint);transform:rotate(45deg);transition:transform .2s;}
details#more[open] summary::after{transform:rotate(-135deg);}
#more-body{padding:4px 16px 16px;}
.more-section{padding:14px 0;}
.more-section + .more-section{border-top:1px solid var(--line);}
.more-section-title{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px;}
.more-link{display:flex;align-items:center;justify-content:space-between;padding:11px 0;font-size:13px;color:var(--ink-soft);}
.more-link a{color:var(--zana-pink);font-weight:600;text-decoration:none;}

/* 年度對比:簡化成兩個數字對比,不畫圖 */
.yoy-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:6px 0;}
.yoy-label{color:var(--ink-soft);}
.yoy-val{font-family:var(--font-mono);font-weight:600;}

footer{text-align:center;padding:18px 0 4px;font-size:10.5px;color:var(--ink-faint);}

/* ≥600px(平板/桌面):放寬但仍是單欄,不做多欄桌面版型(刻意,首屏手機優先) */
@media (min-width:600px){ main{padding-top:18px;} }
</style>
</head>
<body>

<header id="topbar">
  <div class="tb-brand">TZG 日報<em>電商部</em></div>
  <div id="tb-update" class="__STALE_CLASS__"><span class="dot"></span><span id="tb-update-text">__LAST_UPDATE__</span></div>
</header>

<main>

  <section id="kpi-strip">
    <div class="kpi-row">
      <div class="kpi-label">📊 本月達成</div>
      <div><span class="kpi-value tabular" id="kpi-mtd">—</span><span class="kpi-pct" id="kpi-mtd-pct">—</span></div>
    </div>
    <div class="kpi-row">
      <div class="kpi-label">🎯 月底推算</div>
      <div><span class="kpi-value tabular" id="kpi-proj">—</span><span class="kpi-pct" id="kpi-proj-pct">—</span></div>
    </div>
  </section>

  <section class="rank-card" id="rank-agents">
    <div class="rank-head">
      <div class="rank-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div><div class="rank-title">客服接單排行</div><div class="rank-sub">本月 · 該表揚誰、該盯誰</div></div>
    </div>
    <div id="agents-list"></div>
  </section>

  <section class="rank-card" id="rank-products">
    <div class="rank-head">
      <div class="rank-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.91 8.84 8.56 1.69a1.93 1.93 0 0 0-1.95 0L2.08 4.4a2.1 2.1 0 0 0-.08 3.63l12.14 7a1.93 1.93 0 0 0 1.95 0l6.6-3.76a2.1 2.1 0 0 0 .22-3.43Z"/><path d="m3.09 8.84 12.35-7.15a1.93 1.93 0 0 1 1.95 0l4.53 2.71a2.1 2.1 0 0 1 .08 3.63l-12.14 7a1.93 1.93 0 0 1-1.95 0L1.35 11.3a2.1 2.1 0 0 1-.26-2.46Z"/></svg></div>
      <div><div class="rank-title">商品銷售排行</div><div class="rank-sub">本月營收 Top · 什麼該加碼</div></div>
    </div>
    <div id="products-list"></div>
  </section>

  <section class="rank-card" id="rank-regions">
    <div class="rank-head">
      <div class="rank-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
      <div><div class="rank-title">地區業績排行</div><div class="rank-sub">本月 · 哪裡該注意</div></div>
    </div>
    <div id="regions-list"></div>
  </section>

  <details id="more">
    <summary>更多(年度對比、滯銷商品、完整版)</summary>
    <div id="more-body">
      <div class="more-section">
        <div class="more-section-title">年度業績對比</div>
        <div id="yoy-table"></div>
      </div>
      <div class="more-section">
        <div class="more-section-title">滯銷商品(≥60 天沒賣)</div>
        <div id="dormant-list"></div>
      </div>
      <div class="more-section">
        <div class="more-link"><span>即時 / 代理 / 品牌 / 購物習慣 / 客戶結構 / 未付款提醒</span></div>
        <div class="more-link"><a href="dashboard_latest.html">查看完整舊版 →</a></div>
      </div>
    </div>
  </details>

  <footer>TZG 電商部 日報(手機版 · 測試中,正式版請看完整版)</footer>

</main>

<script>
const D={};
</script>
<script>
function fmtMoney(n){ return 'NT$' + Math.round(n).toLocaleString('zh-TW'); }
function fmtPct(n){ return n + '%'; }

function renderKpi(){
  const k = D.kpi || {};
  document.getElementById('kpi-mtd').textContent = fmtMoney(k.rev_mtd || 0);
  document.getElementById('kpi-mtd-pct').textContent = fmtPct(k.achievement_pct ?? 0);
  document.getElementById('kpi-proj').textContent = fmtMoney(k.rev_projected || 0);
  document.getElementById('kpi-proj-pct').textContent = fmtPct(k.proj_achievement_pct ?? 0);
}

function renderRankList(containerId, items, opts){
  const el = document.getElementById(containerId);
  if (!items || !items.length){
    el.innerHTML = '<div class="empty-hint">本月尚無資料</div>';
    return;
  }
  const max = Math.max(...items.map(opts.barValue));
  el.innerHTML = items.slice(0, opts.limit || 5).map((it, i) => {
    const barPct = max > 0 ? Math.max(6, Math.round(opts.barValue(it) / max * 100)) : 0;
    return `<div class="rank-item">
      <div class="rank-no">${i + 1}</div>
      <div class="rank-body">
        <div class="rank-name">${opts.name(it)}</div>
        <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${barPct}%"></div></div>
      </div>
      <div class="rank-value tabular">${opts.value(it)}${opts.sub ? `<small>${opts.sub(it)}</small>` : ''}</div>
    </div>`;
  }).join('');
}

function renderAgents(){
  renderRankList('agents-list', D.agents, {
    limit: 8,
    name: a => a.name,
    barValue: a => a.rev,
    value: a => fmtMoney(a.rev),
    sub: a => `${a.orders} 單 · 客單 ${fmtMoney(a.avg_order)}`,
  });
}

function renderProducts(){
  renderRankList('products-list', D.prod_rev, {
    limit: 6,
    name: p => p.name,
    barValue: p => p.rev,
    value: p => fmtMoney(p.rev),
    sub: p => `${p.qty} 件`,
  });
}

function renderRegions(){
  renderRankList('regions-list', D.regions, {
    limit: 6,
    name: r => r.name,
    barValue: r => r.rev,
    value: r => fmtMoney(r.rev),
    sub: r => `${r.orders} 單 · ${r.customers} 位客戶`,
  });
}

function renderYoy(){
  const cur = D.monthly_26 || [], prev = D.monthly_25 || [];
  const el = document.getElementById('yoy-table');
  if (!cur.length){ el.innerHTML = '<div class="empty-hint">本月尚無資料</div>'; return; }
  const thisMonth = cur.filter(m => m.rev > 0).slice(-1)[0];
  if (!thisMonth){ el.innerHTML = '<div class="empty-hint">本月尚無資料</div>'; return; }
  const idx = cur.indexOf(thisMonth);
  const lastYearSame = prev[idx];
  el.innerHTML = `
    <div class="yoy-row"><span class="yoy-label">${thisMonth.month}(今年)</span><span class="yoy-val tabular">${fmtMoney(thisMonth.rev)}</span></div>
    <div class="yoy-row"><span class="yoy-label">${thisMonth.month}(去年同期)</span><span class="yoy-val tabular">${fmtMoney(lastYearSame ? lastYearSame.rev : 0)}</span></div>`;
}

function renderDormant(){
  const el = document.getElementById('dormant-list');
  const items = D.dormant_45 || [];
  if (!items.length){ el.innerHTML = '<div class="empty-hint">沒有超過 60 天沒賣的商品</div>'; return; }
  el.innerHTML = items.slice(0, 8).map(d =>
    `<div class="rank-item"><div class="rank-body"><div class="rank-name">${d.name}</div></div><div class="rank-value tabular">${d.days} 天</div></div>`
  ).join('');
}

renderKpi();
renderAgents();
renderProducts();
renderRegions();
renderYoy();
renderDormant();
</script>
</body>
</html>
